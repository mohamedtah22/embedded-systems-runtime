name: Host Management QA Lab
on:
  push:
    paths:
      - 'projects/host-management-qa-lab/**'
      - '.github/workflows/host-management-qa-lab.yml'
  pull_request:
    paths:
      - 'projects/host-management-qa-lab/**'
      - '.github/workflows/host-management-qa-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/host-management-qa-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run functional, negative, security and concurrency tests
        run: make test
      - name: Upload reproducible QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-qa-local-junit
          path: projects/host-management-qa-lab/reports/junit.xml
  isolated-network-topology:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/host-management-qa-lab
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose isolated BMC / host-agent QA regression
        run: sh scripts/compose_test.sh
