name: build-and-test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native toolkit
        run: make -j2
      - name: Run native tests
        run: make test

  arm64-qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Cross-compile embedded target
        run: make arm64-target
      - name: Execute ARM64 target self-test under QEMU
        run: make qemu-smoke
