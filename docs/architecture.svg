<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" role="img" aria-labelledby="title desc">
<title id="title">Mini Linux Runtime and Execution Toolkit architecture</title>
<desc id="desc">Implemented CLI dispatches to ELF inspection and memory layout using one parser. Shell, loader, tracing, allocator and networking are planned integrations.</desc>
